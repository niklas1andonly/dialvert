name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Fetch engines (FFmpeg, Pandoc)
        run: powershell -ExecutionPolicy Bypass -File scripts\fetch-engines.ps1

      - name: Build
        run: dotnet build Dialvert.sln -c Release -warnaserror

      - name: Test
        run: dotnet test tests\Dialvert.Core.Tests -c Release --no-build --logger "console;verbosity=normal"
